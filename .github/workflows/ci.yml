---
name: CI
on:
  push:
    branches:
    - master
    paths-ignore:
    - 'scripts/**'
  schedule:
  - cron: '35 17 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
        - info
        - debug
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    name: Setup matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: NVIDIA vGPU Repository
      env:
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL }}
        APT_REPO_PPA_NVIDIA_VGPU_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_URL }}
      run: |
        {
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_URL=${APT_REPO_PPA_NVIDIA_VGPU_URL}";
        } >> "$GITHUB_ENV"
    - name: Setup matrix
      id: matrix
      run: echo "targets=$(rake github:actions:all)" >> "$GITHUB_OUTPUT"
  build-and-publish:
    needs: matrix
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    env:
      TARGET_NAME: ${{ matrix.target.name }}
      RELEASE_DIR: ${{ matrix.target.dir }}
      TARGET_DIRECTORY: /mnt/rootfs
      # The tarball doubles the object storage usage, and nothing fetches it
      DISABLE_TARBALL: 'true'
    steps:
    #
    # Environment Variables
    #
    - name: Log Level
      if: github.event.inputs.logLevel != ''
      env:
        MITAMAE_LOG_LEVEL: ${{ github.event.inputs.logLevel }}
      run: |
        echo "LOG_LEVEL=${MITAMAE_LOG_LEVEL}" >> "$GITHUB_ENV"
    - name: NVIDIA vGPU Repository
      env:
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL }}
        APT_REPO_PPA_NVIDIA_VGPU_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_URL }}
      run: |
        {
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_URL=${APT_REPO_PPA_NVIDIA_VGPU_URL}";
        } >> "$GITHUB_ENV"
    #
    # Prepare
    #
    - name: Update
      run: sudo apt-get -y update
    #
    # Build Image
    #
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 1
    # /tmp on ubuntu-26.04 runners is mounted with nodev, which breaks debootstrap
    - name: Mount Target Directory
      run: sudo mount -t tmpfs -o size=8G tmpfs /mnt
    - name: Initialize
      id: initialize
      run: rake "${TARGET_NAME}:initialize"
    - name: Provision
      id: provision
      run: rake "${TARGET_NAME}:provision"
    - name: Finalize
      id: finalize
      run: rake "${TARGET_NAME}:finalize"
    #
    # Build Artifacts
    #
    - name: Sizes
      if: success()
      run: ls -lah "releases/${RELEASE_DIR}/"
    - name: Packages
      if: success()
      run: cat "releases/${RELEASE_DIR}/packages.manifest"
    - name: Checksums
      if: success()
      run: cat "releases/${RELEASE_DIR}/SHA256SUMS"
    #
    # Check Mount Point
    #
    - name: Check Mount Point
      if: failure()
      run: findmnt -aR /
    - name: Check Open Process
      if: failure()
      run: lsof /
    #
    # Check Publish Target
    #
    - name: Check Publish Target
      run: rake "github:actions:publish:${TARGET_NAME}" >> "$GITHUB_ENV"
    #
    # Check Difference
    #
    - name: Download Packages Manifest
      if: env.PUBLISH == 'true'
      env:
        S3_BUCKET_URL: ${{ secrets.S3_BUCKET_URL }}
      run: |
        wget -qO /tmp/packages.manifest "${S3_BUCKET_URL}/${RELEASE_DIR}/packages.manifest" || touch /tmp/packages.manifest
    - name: Check Difference
      if: env.PUBLISH == 'true'
      run: diff -u /tmp/packages.manifest "releases/${RELEASE_DIR}/packages.manifest" || echo 'PUBLISH_SYNC=true' >> "$GITHUB_ENV"
    #
    # Setup Rclone
    #
    - name: Setup rclone
      if: env.PUBLISH_SYNC == 'true'
      run: curl https://rclone.org/install.sh | sudo bash
    #
    # Publish S3
    #
    - name: Publish
      if: env.PUBLISH_SYNC == 'true'
      env:
        RCLONE_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
        RCLONE_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
        RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: >-
        rclone sync -v
        --config /dev/null
        --checksum
        --retries 10
        --retries-sleep "$(( ( RANDOM % 60 )  + 1 ))s"
        --low-level-retries 10
        --stats 3s
        --stats-file-name-length 0
        --stats-one-line
        "releases/${RELEASE_DIR}"
        ":s3:mitamae-cloud-image/${RELEASE_DIR}"
  # The sync step compares a multipart object by the MD5 that rclone computed
  # before the upload, so it keeps an object broken on the storage side. Fetch
  # every published file from the public URL and check it against SHA256SUMS.
  # A broken object cannot be uploaded again here, so delete it together with
  # the packages manifest, and the next run uploads it again.
  verify:
    if: ${{ !cancelled() }}
    needs: [matrix, build-and-publish]
    name: Verify ${{ matrix.target.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    env:
      RELEASE_DIR: ${{ matrix.target.dir }}
    steps:
    - name: Verify
      env:
        S3_BUCKET_URL: ${{ secrets.S3_BUCKET_URL }}
      run: |
        URL="${S3_BUCKET_URL}/${RELEASE_DIR}"
        cd "${RUNNER_TEMP}"
        : > broken.txt
        if ! wget -q --tries=5 --waitretry=10 --retry-on-http-error=500,502,503,504 -O SHA256SUMS "${URL}/SHA256SUMS"; then
          echo "::error::SHA256SUMS is missing"
          exit 1
        fi
        while read -r sum name; do
          if wget -q --tries=5 --waitretry=10 --retry-on-http-error=500,502,503,504 -O file "${URL}/${name}" &&
              echo "${sum}  file" | sha256sum --check --status; then
            echo "OK: ${name}"
          else
            echo "::error::Broken or missing: ${name}"
            echo "${name}" >> broken.txt
          fi
          rm -f file
        done < SHA256SUMS
        test ! -s broken.txt
    - name: Setup rclone
      if: failure()
      run: curl https://rclone.org/install.sh | sudo bash
    - name: Delete
      if: failure()
      env:
        RCLONE_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
        RCLONE_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
        RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        DST=":s3:mitamae-cloud-image/${RELEASE_DIR}"
        touch "${RUNNER_TEMP}/broken.txt"
        while read -r name; do
          rclone deletefile -v --config /dev/null "${DST}/${name}" || true
        done < "${RUNNER_TEMP}/broken.txt"
        rclone deletefile -v --config /dev/null "${DST}/packages.manifest" || true
  # Aborted uploads leave their parts behind, and the parts take the storage
  # until they are removed. The concurrency group runs one workflow at a time,
  # so every pending upload is stale once all the matrix jobs are done.
  cleanup:
    if: always()
    needs: [build-and-publish, verify]
    name: Cleanup multipart uploads
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Setup rclone
      run: curl https://rclone.org/install.sh | sudo bash
    - name: Cleanup
      env:
        RCLONE_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
        RCLONE_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
        RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: >-
        rclone backend cleanup -v
        --config /dev/null
        ":s3:mitamae-cloud-image"
        -o max-age=0
  actions-timeline:
    if: always()
    needs: [matrix, build-and-publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
    - uses: Kesin11/actions-timeline@v3
