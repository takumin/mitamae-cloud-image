---
name: CI
on:
  push:
    branches:
    - master
    paths-ignore:
    - 'scripts/**'
  schedule:
  - cron: '35 17 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
        - info
        - debug
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    name: Setup matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: NVIDIA vGPU Repository
      env:
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL }}
        APT_REPO_PPA_NVIDIA_VGPU_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_URL }}
      run: |
        {
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_URL=${APT_REPO_PPA_NVIDIA_VGPU_URL}";
        } >> "$GITHUB_ENV"
    - name: Setup matrix
      id: matrix
      run: echo "targets=$(rake github:actions:all)" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    env:
      TARGET_NAME: ${{ matrix.target.name }}
      RELEASE_DIR: ${{ matrix.target.dir }}
      # The tarball doubles the object storage usage, and nothing fetches it
      DISABLE_TARBALL: 'true'
    steps:
    #
    # Environment Variables
    #
    - name: Log Level
      if: github.event.inputs.logLevel != ''
      env:
        MITAMAE_LOG_LEVEL: ${{ github.event.inputs.logLevel }}
      run: |
        echo "LOG_LEVEL=${MITAMAE_LOG_LEVEL}" >> "$GITHUB_ENV"
    - name: NVIDIA vGPU Repository
      env:
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT }}
        APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL }}
        APT_REPO_PPA_NVIDIA_VGPU_URL: ${{ secrets.APT_REPO_PPA_NVIDIA_VGPU_URL }}
      run: |
        {
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_UID}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_FINGER_PRINT}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL=${APT_REPO_PPA_NVIDIA_VGPU_KEYRING_URL}";
          echo "APT_REPO_PPA_NVIDIA_VGPU_URL=${APT_REPO_PPA_NVIDIA_VGPU_URL}";
        } >> "$GITHUB_ENV"
    #
    # Prepare
    #
    - name: Update
      run: sudo apt-get -y update
    #
    # Build Image
    #
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 1
    - name: Initialize
      id: initialize
      run: rake "${TARGET_NAME}:initialize"
    - name: Provision
      id: provision
      run: rake "${TARGET_NAME}:provision"
    - name: Finalize
      id: finalize
      run: rake "${TARGET_NAME}:finalize"
    #
    # Build Artifacts
    #
    - name: Sizes
      if: success()
      run: ls -lah "releases/${RELEASE_DIR}/"
    - name: Packages
      if: success()
      run: cat "releases/${RELEASE_DIR}/packages.manifest"
    - name: Checksums
      if: success()
      run: cat "releases/${RELEASE_DIR}/SHA256SUMS"
    #
    # Check Mount Point
    #
    - name: Check Mount Point
      if: failure()
      run: findmnt -aR /
    - name: Check Open Process
      if: failure()
      run: lsof /
    #
    # Check Publish Target
    #
    - name: Check Publish Target
      run: rake "github:actions:publish:${TARGET_NAME}" >> "$GITHUB_ENV"
    #
    # Check Difference
    #
    - name: Download Packages Manifest
      if: env.PUBLISH == 'true'
      env:
        S3_BUCKET_URL: ${{ secrets.S3_BUCKET_URL }}
      run: |
        wget -qO /tmp/packages.manifest "${S3_BUCKET_URL}/${RELEASE_DIR}/packages.manifest" || touch /tmp/packages.manifest
    - name: Check Difference
      if: env.PUBLISH == 'true'
      run: diff -u /tmp/packages.manifest "releases/${RELEASE_DIR}/packages.manifest" || echo 'PUBLISH_SYNC=true' >> "$GITHUB_ENV"
    #
    # Upload Artifact
    #
    - name: Check Local Files
      if: env.PUBLISH_SYNC == 'true'
      working-directory: releases/${{ matrix.target.dir }}
      run: sha256sum --check --strict SHA256SUMS
    - name: Upload Artifact
      if: env.PUBLISH_SYNC == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target.artifact }}
        path: releases/${{ matrix.target.dir }}
        if-no-files-found: error
        retention-days: 1
        # The images are compressed already
        compression-level: 0
        overwrite: true
  # The sync compares a multipart object by the MD5 that rclone computed before
  # the upload, so it keeps an object broken on the storage side. Read every
  # object back from the storage, check it against SHA256SUMS, and upload the
  # broken ones again until all of them match. The packages manifest goes up
  # last: the build job publishes when it differs, so the next run retries a
  # release that did not complete.
  publish:
    if: ${{ !cancelled() }}
    needs: [matrix, build]
    name: Publish ${{ matrix.target.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    env:
      RELEASE_DIR: ${{ matrix.target.dir }}
      ARTIFACT_NAME: ${{ matrix.target.artifact }}
      PUBLISH_ATTEMPTS: 3
    steps:
    # The build job uploads the artifact only when the release has to be published
    - name: Check Artifact
      id: artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" \
          --jq '[.artifacts[] | select(.expired | not)] | length')"
        if [ "${count}" -gt 0 ]; then
          echo 'found=true' >> "$GITHUB_OUTPUT"
        else
          echo 'Nothing to publish'
        fi
    - name: Download Artifact
      if: steps.artifact.outputs.found == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.target.artifact }}
        path: ${{ runner.temp }}/release
    - name: Check Local Files
      if: steps.artifact.outputs.found == 'true'
      working-directory: ${{ runner.temp }}/release
      run: sha256sum --check --strict SHA256SUMS
    - name: Setup rclone
      if: steps.artifact.outputs.found == 'true'
      run: curl https://rclone.org/install.sh | sudo bash
    - name: Publish
      if: steps.artifact.outputs.found == 'true'
      working-directory: ${{ runner.temp }}/release
      env:
        RCLONE_CONFIG: /dev/null
        RCLONE_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
        RCLONE_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
        RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        DST=":s3:mitamae-cloud-image/${RELEASE_DIR}"
        EXPECTED="${RUNNER_TEMP}/expected"
        { cat SHA256SUMS; sha256sum SHA256SUMS; } > "${EXPECTED}"

        # Succeeds when the object on the storage matches the local file
        verify() {
          local want got
          want="$(awk -v name="$1" '$2 == name { print $1 }' "${EXPECTED}")"
          got="$(rclone cat --low-level-retries 10 "${DST}/$1" | sha256sum | cut -d' ' -f1)" || return 1
          [ -n "${want}" ] && [ "${want}" = "${got}" ]
        }

        for attempt in $(seq "${PUBLISH_ATTEMPTS}"); do
          echo "::group::Upload (attempt ${attempt}/${PUBLISH_ATTEMPTS})"
          rclone sync -v \
            --checksum \
            --exclude packages.manifest \
            --retries 10 \
            --retries-sleep "$(( ( RANDOM % 60 )  + 1 ))s" \
            --low-level-retries 10 \
            --stats 3s \
            --stats-file-name-length 0 \
            --stats-one-line \
            . "${DST}" || echo '::warning::rclone sync failed'
          echo '::endgroup::'

          broken=()
          while read -r _ name; do
            [ "${name}" = packages.manifest ] && continue
            if verify "${name}" < /dev/null; then
              echo "OK: ${name}"
            else
              echo "::warning::Broken or missing: ${name}"
              broken+=("${name}")
            fi
          done < "${EXPECTED}"

          if [ "${#broken[@]}" -eq 0 ]; then
            if rclone copyto -v --checksum packages.manifest "${DST}/packages.manifest" &&
                verify packages.manifest; then
              echo 'OK: packages.manifest'
              exit 0
            fi
            echo '::warning::Broken or missing: packages.manifest'
            broken=(packages.manifest)
          fi

          # The sync keeps an object whose stored MD5 matches, so delete the
          # broken ones to upload them again
          for name in "${broken[@]}"; do
            rclone deletefile -v "${DST}/${name}" || true
          done
        done

        echo "::error::The published files did not match after ${PUBLISH_ATTEMPTS} attempts"
        rclone deletefile -v "${DST}/packages.manifest" || true
        exit 1
  # Aborted uploads leave their parts behind, and the parts take the storage
  # until they are removed. The concurrency group runs one workflow at a time,
  # so every pending upload is stale once all the matrix jobs are done.
  cleanup:
    if: always()
    needs: [build, publish]
    name: Cleanup multipart uploads
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Setup rclone
      run: curl https://rclone.org/install.sh | sudo bash
    - name: Cleanup
      env:
        RCLONE_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
        RCLONE_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
        RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: >-
        rclone backend cleanup -v
        --config /dev/null
        ":s3:mitamae-cloud-image"
        -o max-age=0
  actions-timeline:
    if: always()
    needs: [matrix, build, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
    - uses: Kesin11/actions-timeline@v3
